<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0c0c0f" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22222c" />
      <stop offset="100%" stop-color="#181820" />
    </linearGradient>
  </defs>

  <!-- Device Frame -->
  <rect width="400" height="800" rx="44" fill="#050507" stroke="#2a2a35" stroke-width="4" />
  <rect x="12" y="12" width="376" height="776" rx="34" fill="url(#phoneBg)" />

  <!-- Dynamic Island -->
  <rect x="135" y="22" width="130" height="26" rx="13" fill="#000000" />

  <!-- Top App Bar -->
  <g transform="translate(24, 64)">
    <text x="0" y="20" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="13">Good morning, Aman 👋</text>
    <rect x="250" y="4" width="100" height="24" rx="12" fill="#242430" stroke="#E5C07B" stroke-width="0.8" />
    <text x="264" y="20" fill="#E5C07B" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">★ VIP Studio</text>
    
    <text x="0" y="60" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700">What are you wearing today?</text>

    <!-- Weather Pill -->
    <rect x="0" y="80" width="352" height="38" rx="12" fill="#1b1b24" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="14" y="104" fill="#60a5fa" font-size="14">⛅</text>
    <text x="36" y="103" fill="#d1d5db" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="500">22°C • Partly Sunny • Mild Breeze (Breathable)</text>
  </g>

  <!-- Occasion Filter Chips -->
  <g transform="translate(24, 204)">
    <rect x="0" y="0" width="76" height="32" rx="16" fill="#E5C07B" />
    <text x="18" y="21" fill="#121212" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Casual</text>

    <rect x="84" y="0" width="76" height="32" rx="16" fill="#1b1b24" />
    <text x="100" y="21" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">College</text>

    <rect x="168" y="0" width="68" height="32" rx="16" fill="#1b1b24" />
    <text x="184" y="21" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">Office</text>

    <rect x="244" y="0" width="64" height="32" rx="16" fill="#1b1b24" />
    <text x="260" y="21" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">Party</text>
  </g>

  <!-- Curated Fit Hero Card -->
  <g transform="translate(24, 252)">
    <rect width="352" height="390" rx="24" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" />

    <!-- Visual Layer / Illustration -->
    <rect x="16" y="16" width="320" height="230" rx="16" fill="#16161f" />
    <circle cx="176" cy="115" r="70" fill="#2d2d3d" fill-opacity="0.4" />
    <path d="M 120 80 Q 176 60 232 80 L 220 180 L 132 180 Z" fill="#38384d" stroke="#ffffff" stroke-opacity="0.15" />
    <rect x="145" y="170" width="62" height="60" fill="#282838" />

    <!-- Badges inside hero -->
    <rect x="28" y="28" width="85" height="26" rx="13" fill="#000000" fill-opacity="0.6" stroke="#10b981" stroke-width="1" />
    <circle cx="42" cy="41" r="4" fill="#10b981" />
    <text x="52" y="45" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">96% Match</text>

    <!-- Bookmark button -->
    <circle cx="316" cy="41" r="16" fill="#000000" fill-opacity="0.6" />
    <text x="310" y="47" fill="#E5C07B" font-size="14">🔖</text>

    <!-- Title & Rationale -->
    <text x="28" y="275" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700">Clean Minimalist</text>
    <rect x="236" y="260" width="100" height="20" rx="6" fill="#E5C07B" fill-opacity="0.15" />
    <text x="244" y="274" fill="#E5C07B" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">BREATHABLE COTTON</text>

    <text x="28" y="296" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11.5">Ivory Relaxed Tee • Beige Pleated Trousers • Low Chalks</text>

    <!-- CTAs -->
    <g transform="translate(16, 322)">
      <rect x="0" y="0" width="195" height="48" rx="14" fill="#E5C07B" />
      <text x="50" y="30" fill="#121212" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">✓ Wear This Look</text>

      <rect x="207" y="0" width="113" height="48" rx="14" fill="#22222e" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="228" y="30" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">🔄 Next Look</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(24, 680)">
    <rect width="352" height="64" rx="20" fill="#16161e" stroke="#ffffff" stroke-opacity="0.08" />
    <g transform="translate(24, 20)">
      <text x="0" y="16" fill="#E5C07B" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">● Today</text>
      <text x="75" y="16" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">Closet</text>
      <text x="145" y="16" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">Create</text>
      <text x="215" y="16" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">Stylist</text>
      <text x="280" y="16" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">DNA</text>
    </g>
  </g>
</svg>
