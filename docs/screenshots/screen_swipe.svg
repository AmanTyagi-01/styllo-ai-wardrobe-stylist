<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0c0c0f" />
    </linearGradient>
  </defs>

  <rect width="400" height="800" rx="44" fill="#050507" stroke="#2a2a35" stroke-width="4" />
  <rect x="12" y="12" width="376" height="776" rx="34" fill="url(#phoneBg)" />
  <rect x="135" y="22" width="130" height="26" rx="13" fill="#000000" />

  <!-- Header -->
  <g transform="translate(24, 68)">
    <text x="0" y="20" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">EDITORIAL CURATION</text>
    <text x="0" y="50" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700">Swipe Deck Stylist</text>
  </g>

  <!-- Card Deck Stack Effect -->
  <g transform="translate(44, 150)">
    <!-- Back Card 2 -->
    <rect x="-8" y="-16" width="328" height="440" rx="24" fill="#1a1a24" stroke="#ffffff" stroke-opacity="0.04" />
    <!-- Back Card 1 -->
    <rect x="-4" y="-8" width="320" height="440" rx="24" fill="#20202c" stroke="#ffffff" stroke-opacity="0.06" />

    <!-- Active Front Card -->
    <rect x="0" y="0" width="312" height="440" rx="24" fill="#282838" stroke="#E5C07B" stroke-width="1.2" />

    <!-- Card Image Layer -->
    <rect x="14" y="14" width="284" height="230" rx="16" fill="#181822" />
    <path d="M 80 80 Q 156 50 232 80 L 210 190 L 100 190 Z" fill="#3b3b4f" />
    <rect x="120" y="180" width="72" height="50" fill="#4d4d68" />

    <!-- Harmony Score -->
    <rect x="24" y="24" width="90" height="28" rx="14" fill="#000000" fill-opacity="0.7" />
    <text x="36" y="43" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">★ 94% Fit</text>

    <!-- Card Description -->
    <text x="20" y="274" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700">Tailored Silk &amp; Pleat</text>
    <text x="20" y="296" fill="#E5C07B" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Smart Evening Reception</text>
    <text x="20" y="324" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11.5" width="270">
      "The contrast of rich black silk against crisp ivory pleats creates effortless presence without feeling formal."
    </text>

    <!-- Garment Breakdown Pills -->
    <rect x="20" y="375" width="80" height="24" rx="8" fill="#181822" />
    <text x="28" y="391" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="10">Silk Shirt</text>

    <rect x="106" y="375" width="94" height="24" rx="8" fill="#181822" />
    <text x="114" y="391" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="10">Ivory Pleats</text>

    <rect x="206" y="375" width="84" height="24" rx="8" fill="#181822" />
    <text x="214" y="391" fill="#e5e7eb" font-family="-apple-system, sans-serif" font-size="10">Leather Loafer</text>
  </g>

  <!-- Swipe Actions Controller -->
  <g transform="translate(60, 620)">
    <!-- Pass Left Button -->
    <circle cx="40" cy="30" r="30" fill="#20202c" stroke="#ef4444" stroke-width="1.5" />
    <text x="32" y="38" fill="#ef4444" font-size="22" font-weight="bold">✕</text>

    <!-- Undo Button -->
    <circle cx="140" cy="30" r="22" fill="#1b1b24" stroke="#9ca3af" stroke-width="1" />
    <text x="132" y="36" fill="#9ca3af" font-size="16">↺</text>

    <!-- Save / Like Right Button -->
    <circle cx="240" cy="30" r="30" fill="#20202c" stroke="#10b981" stroke-width="1.5" />
    <text x="228" y="38" fill="#10b981" font-size="22">♥</text>
  </g>
</svg>
