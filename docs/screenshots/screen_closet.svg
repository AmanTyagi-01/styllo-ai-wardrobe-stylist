<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0c0c0f" />
    </linearGradient>
  </defs>

  <rect width="400" height="800" rx="44" fill="#050507" stroke="#2a2a35" stroke-width="4" />
  <rect x="12" y="12" width="376" height="776" rx="34" fill="url(#phoneBg)" />
  <rect x="135" y="22" width="130" height="26" rx="13" fill="#000000" />

  <!-- Header -->
  <g transform="translate(24, 68)">
    <text x="0" y="20" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">ATELIER ARCHIVE</text>
    <text x="0" y="52" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700">Digital Closet</text>
    <text x="290" y="52" fill="#E5C07B" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">42 Pieces</text>

    <!-- Search Bar -->
    <rect x="0" y="70" width="352" height="40" rx="12" fill="#1b1b24" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="14" y="95" fill="#9ca3af" font-size="14">🔍</text>
    <text x="38" y="95" fill="#6b7280" font-family="-apple-system, sans-serif" font-size="12">Search silk, linen, cargos, hoodies...</text>
  </g>

  <!-- Category Filter Pills -->
  <g transform="translate(24, 196)">
    <rect x="0" y="0" width="56" height="30" rx="15" fill="#E5C07B" />
    <text x="18" y="20" fill="#121212" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">All</text>

    <rect x="64" y="0" width="84" height="30" rx="15" fill="#1b1b24" />
    <text x="76" y="20" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11">Upperwear</text>

    <rect x="156" y="0" width="86" height="30" rx="15" fill="#1b1b24" />
    <text x="168" y="20" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11">Bottomwear</text>

    <rect x="250" y="0" width="80" height="30" rx="15" fill="#1b1b24" />
    <text x="262" y="20" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11">Footwear</text>
  </g>

  <!-- Wardrobe 2x2 Grid -->
  <g transform="translate(24, 244)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="190" rx="18" fill="#1c1c26" stroke="#ffffff" stroke-opacity="0.08" />
      <rect x="10" y="10" width="150" height="105" rx="12" fill="#14141c" />
      <circle cx="85" cy="62" r="32" fill="#28283a" />
      <text x="14" y="134" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Heavy Black Hoodie</text>
      <text x="14" y="152" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11">Onyx • French Terry</text>
      <rect x="14" y="160" width="60" height="18" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="20" y="173" fill="#10b981" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">14 Wears</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(182, 0)">
      <rect width="170" height="190" rx="18" fill="#1c1c26" stroke="#ffffff" stroke-opacity="0.08" />
      <rect x="10" y="10" width="150" height="105" rx="12" fill="#14141c" />
      <circle cx="85" cy="62" r="32" fill="#3a3628" />
      <text x="14" y="134" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Pleated Trousers</text>
      <text x="14" y="152" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11">Sand • Wool Blend</text>
      <rect x="14" y="160" width="60" height="18" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="20" y="173" fill="#10b981" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">9 Wears</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 204)">
      <rect width="170" height="190" rx="18" fill="#1c1c26" stroke="#ffffff" stroke-opacity="0.08" />
      <rect x="10" y="10" width="150" height="105" rx="12" fill="#14141c" />
      <circle cx="85" cy="62" r="32" fill="#2d3748" />
      <text x="14" y="134" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Utility Cargos</text>
      <text x="14" y="152" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11">Slate Grey • Cotton</text>
      <rect x="14" y="160" width="60" height="18" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="20" y="173" fill="#10b981" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">11 Wears</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(182, 204)">
      <rect width="170" height="190" rx="18" fill="#1c1c26" stroke="#ffffff" stroke-opacity="0.08" />
      <rect x="10" y="10" width="150" height="105" rx="12" fill="#14141c" />
      <circle cx="85" cy="62" r="32" fill="#4a4030" />
      <text x="14" y="134" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Chalk Low Sneakers</text>
      <text x="14" y="152" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="11">Chalk • Calfskin</text>
      <rect x="14" y="160" width="60" height="18" rx="6" fill="#10b981" fill-opacity="0.2" />
      <text x="20" y="173" fill="#10b981" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">35 Wears</text>
    </g>
  </g>

  <!-- Add Item Floating Action Button -->
  <g transform="translate(310, 670)">
    <circle cx="28" cy="28" r="28" fill="#E5C07B" />
    <text x="20" y="36" fill="#121212" font-size="26" font-weight="bold">+</text>
  </g>
</svg>
