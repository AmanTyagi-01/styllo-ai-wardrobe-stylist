<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#141419" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C07B" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="460" fill="url(#bgGrad)" />
  <circle cx="200" cy="100" r="300" fill="url(#accentGlow)" />
  <circle cx="1050" cy="380" r="260" fill="url(#accentGlow)" />

  <!-- Geometric Grid & Editorial Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="380" x2="1200" y2="380" />
    <line x1="160" y1="0" x2="160" y2="460" />
    <line x1="1040" y1="0" x2="1040" y2="460" />
  </g>

  <!-- Border Accent Frame -->
  <rect x="30" y="30" width="1140" height="400" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

  <!-- Badge Top -->
  <g transform="translate(60, 65)">
    <rect width="190" height="32" rx="16" fill="#1f1f24" stroke="#ffffff" stroke-opacity="0.12" />
    <circle cx="18" cy="16" r="4" fill="#10B981" />
    <text x="32" y="21" fill="#F3E5AB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">ANDROID • JETPACK COMPOSE</text>
  </g>

  <!-- Brand Typography -->
  <text x="60" y="180" fill="url(#goldGrad)" font-family="'Didot', 'Playfair Display', Georgia, serif" font-size="78" font-weight="700" letter-spacing="6">STYLLO</text>
  <text x="60" y="225" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="300" letter-spacing="1">AI Wardrobe &amp; Personal Editorial Stylist</text>

  <!-- Tagline Quote -->
  <text x="60" y="270" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-style="italic">
    "Don't search your wardrobe. Swipe your style."
  </text>

  <!-- Feature Pills -->
  <g transform="translate(60, 315)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="38" rx="10" fill="#1b1b22" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="20" y="24" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">✨ Gemini AI Assistant</text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="175" height="38" rx="10" fill="#1b1b22" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="205" y="24" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">👔 Swipe Deck Engine</text>

    <!-- Pill 3 -->
    <rect x="375" y="0" width="170" height="38" rx="10" fill="#1b1b22" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="395" y="24" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">🌤️ Climate Sync Fit</text>

    <!-- Pill 4 -->
    <rect x="560" y="0" width="170" height="38" rx="10" fill="#1b1b22" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="580" y="24" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500">🧬 Style DNA Profiler</text>
  </g>

  <!-- Stylized Decorative Phone Mockup Outline on Right -->
  <g transform="translate(860, 45)">
    <!-- Outer Phone Shadow / Border -->
    <rect x="0" y="0" width="230" height="370" rx="32" fill="#111116" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" />
    <!-- Dynamic Island / Notch -->
    <rect x="75" y="12" width="80" height="16" rx="8" fill="#000000" />
    <!-- Screen Header -->
    <text x="20" y="55" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">TODAY'S CURATED FIT</text>
    <text x="20" y="78" fill="#FFFFFF" font-family="'Didot', Georgia, serif" font-size="18" font-weight="700">Clean Minimalist</text>
    <!-- Score Badge -->
    <rect x="155" y="58" width="55" height="24" rx="12" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
    <text x="168" y="74" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">96%</text>
    
    <!-- Hero Card Mockup -->
    <rect x="18" y="94" width="194" height="180" rx="16" fill="#1c1c24" />
    <path d="M 50 140 Q 115 110 180 140 L 165 240 L 65 240 Z" fill="#2a2a38" stroke="#ffffff" stroke-opacity="0.08" />
    <!-- Tags -->
    <rect x="28" y="245" width="80" height="18" rx="6" fill="#0c0c10" />
    <text x="35" y="258" fill="#F3E5AB" font-family="-apple-system, sans-serif" font-size="9" font-weight="600">RELAXED COTTON</text>
    <!-- CTA Button -->
    <rect x="18" y="290" width="194" height="42" rx="12" fill="#F3E5AB" />
    <text x="75" y="316" fill="#121212" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Wear This Look</text>
  </g>
</svg>
