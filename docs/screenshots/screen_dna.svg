<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0c0c0f" />
    </linearGradient>
  </defs>

  <rect width="400" height="800" rx="44" fill="#050507" stroke="#2a2a35" stroke-width="4" />
  <rect x="12" y="12" width="376" height="776" rx="34" fill="url(#phoneBg)" />
  <rect x="135" y="22" width="130" height="26" rx="13" fill="#000000" />

  <!-- Header -->
  <g transform="translate(24, 68)">
    <text x="0" y="20" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">ARCHETYPE INTELLIGENCE</text>
    <text x="0" y="52" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="26" font-weight="700">Your Style DNA</text>
  </g>

  <!-- Profile Card -->
  <g transform="translate(24, 140)">
    <rect width="352" height="90" rx="20" fill="#1c1c28" stroke="#ffffff" stroke-opacity="0.08" />
    <circle cx="45" cy="45" r="25" fill="#E5C07B" />
    <text x="36" y="52" fill="#121212" font-size="20" font-weight="bold">AT</text>

    <text x="82" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Aman Tyagi</text>
    <text x="82" y="56" fill="#9ca3af" font-family="-apple-system, sans-serif" font-size="12">Atelier VIP Member • 42 Pieces Tracked</text>
    <text x="82" y="72" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">78% Wardrobe Utilization Rate</text>
  </g>

  <!-- Aesthetic Breakdown Bars -->
  <g transform="translate(24, 250)">
    <text x="0" y="16" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="600">Style Affinity Matrix</text>

    <!-- Bar 1: Streetwear -->
    <g transform="translate(0, 36)">
      <text x="0" y="14" fill="#d1d5db" font-family="-apple-system, sans-serif" font-size="13">Streetwear Architecture</text>
      <text x="320" y="14" fill="#E5C07B" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">90%</text>
      <rect x="0" y="24" width="352" height="8" rx="4" fill="#242432" />
      <rect x="0" y="24" width="316" height="8" rx="4" fill="#E5C07B" />
    </g>

    <!-- Bar 2: Smart Casual -->
    <g transform="translate(0, 84)">
      <text x="0" y="14" fill="#d1d5db" font-family="-apple-system, sans-serif" font-size="13">Clean Smart Casual</text>
      <text x="320" y="14" fill="#60a5fa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">84%</text>
      <rect x="0" y="24" width="352" height="8" rx="4" fill="#242432" />
      <rect x="0" y="24" width="295" height="8" rx="4" fill="#60a5fa" />
    </g>

    <!-- Bar 3: Minimalist -->
    <g transform="translate(0, 132)">
      <text x="0" y="14" fill="#d1d5db" font-family="-apple-system, sans-serif" font-size="13">Monochrome Minimal</text>
      <text x="320" y="14" fill="#a78bfa" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">72%</text>
      <rect x="0" y="24" width="352" height="8" rx="4" fill="#242432" />
      <rect x="0" y="24" width="253" height="8" rx="4" fill="#a78bfa" />
    </g>
  </g>

  <!-- Signature Color Palette -->
  <g transform="translate(24, 450)">
    <text x="0" y="16" fill="#ffffff" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="600">Signature Color Palette</text>

    <g transform="translate(0, 32)">
      <circle cx="28" cy="28" r="26" fill="#0f0f14" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="14" y="70" fill="#9ca3af" font-size="10">Onyx</text>

      <circle cx="92" cy="28" r="26" fill="#F4F4F0" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="78" y="70" fill="#9ca3af" font-size="10">Ivory</text>

      <circle cx="156" cy="28" r="26" fill="#C2B280" />
      <text x="144" y="70" fill="#9ca3af" font-size="10">Sand</text>

      <circle cx="220" cy="28" r="26" fill="#708090" />
      <text x="208" y="70" fill="#9ca3af" font-size="10">Slate</text>

      <circle cx="284" cy="28" r="26" fill="#2F4F4F" />
      <text x="270" y="70" fill="#9ca3af" font-size="10">Olive</text>
    </g>
  </g>

  <!-- Wardrobe Health Badge -->
  <g transform="translate(24, 570)">
    <rect width="352" height="80" rx="18" fill="#1b1b26" stroke="#10b981" stroke-opacity="0.3" />
    <text x="20" y="32" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">🌿 SUSTAINABLE ROTATION ACTIVE</text>
    <text x="20" y="54" fill="#d1d5db" font-family="-apple-system, sans-serif" font-size="12">Anti-repeat algorithm guarantees 14-day silhouette cycle.</text>
  </g>
</svg>
